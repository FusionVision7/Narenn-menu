<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Narenn · Narenn’s Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#efddd3;--card:#f6e4db;--ink:#7a1a12;--mut:#8b3a2c;--gold:#c0902c;--line:#e0c7b6;--red:#a3211a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100%;overflow-x:hidden;background:radial-gradient(ellipse at 15% 8%,#e8cbbd 0,transparent 45%),radial-gradient(ellipse at 92% 28%,#ecd5ca 0,transparent 50%),radial-gradient(ellipse at 8% 85%,#c9bab0 0,transparent 45%),radial-gradient(ellipse at 92% 96%,#e0d3c3 0,transparent 45%),#efddd3;background-attachment:fixed}
body::before{content:"";position:fixed;top:70px;left:-30px;width:200px;height:60px;transform:rotate(-38deg);background:radial-gradient(circle,#c9962e 1px,transparent 1.6px) 0 0/5px 5px;-webkit-mask-image:radial-gradient(ellipse,#000 30%,transparent 72%);mask-image:radial-gradient(ellipse,#000 30%,transparent 72%);opacity:.8;pointer-events:none}
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.7,0,.2,1),opacity .8s;cursor:pointer}
#splash.out{transform:translateY(-100%);opacity:0}
#splash svg{width:120px;height:120px}
.ring{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.6s ease forwards}
.nn{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:140;stroke-dashoffset:140;animation:draw 1.2s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-h{font-size:11px;letter-spacing:.5em;color:var(--mut);margin-top:18px;opacity:0;animation:up .8s 1.4s forwards}
.sp-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:44px;letter-spacing:.12em;color:var(--ink);opacity:0;animation:up .9s 1.7s forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{text-align:center;padding:36px 20px 12px}
header .k{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;color:var(--red);margin:0}
header p{margin:6px 0 0;color:var(--mut);font-size:13px}
nav{position:sticky;top:0;z-index:10;background:var(--bg);padding:env(safe-area-inset-top,0px) 0 0;border-bottom:1px solid var(--line)}
nav div{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav div::-webkit-scrollbar{display:none}
nav a{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;transition:.25s}
nav a.on{background:var(--red);color:var(--bg);border-color:var(--red)}
main{max-width:620px;margin:0 auto;padding:8px 14px 60px}
section{margin-top:28px;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
section.show{opacity:1;transform:none}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:28px;margin:0;color:var(--red)}
.tm{font-size:12px;color:var(--gold);margin:2px 0 12px;letter-spacing:.04em}
h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:13px 14px;cursor:pointer;transition:box-shadow .25s,border-color .25s}
.it.open{border-color:var(--gold);box-shadow:0 6px 18px rgba(184,137,43,.18)}
.r{display:flex;align-items:center;gap:10px}
.d{flex:none;width:13px;height:13px;border:1.5px solid;border-radius:2px;display:grid;place-items:center}
.d::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.v{color:#1e9e50}.n{color:#d0342c}
.nm{flex:1;font-weight:600;font-size:15px}
.pr{font-weight:600;color:var(--gold);font-size:14px;white-space:nowrap}
.ds{max-height:0;overflow:hidden;opacity:0;font-size:13px;line-height:1.5;color:var(--mut);transition:max-height .35s ease,opacity .35s,margin .35s;padding-left:23px}
.it.open .ds{max-height:80px;opacity:1;margin-top:8px}
footer{text-align:center;font-size:11px;color:var(--mut);padding:0 20px 40px;line-height:1.6}
header{padding:30px 20px 6px;position:relative}
.lg{width:78px;height:78px}
.lh{font-size:9px;letter-spacing:.5em;color:var(--mut);margin-top:4px}
.ln{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;letter-spacing:.1em;color:var(--ink);line-height:1.1}
header .k{font-family:Georgia,'Times New Roman',serif;font-size:30px;font-weight:400;text-transform:uppercase;color:var(--red);margin:14px 0 0}
nav{background:var(--bg)}
main{position:relative;isolation:isolate;width:calc(100% - 28px);max-width:600px;margin:10px auto 24px;padding:6px 20px 34px;background:rgba(246,228,219,.88);border:2px solid var(--gold)}
main::before{content:"";position:absolute;inset:9px -9px -9px 9px;border:2px solid var(--gold);transform:rotate(-.4deg);z-index:-1;pointer-events:none}
h2{display:block;width:fit-content;min-width:210px;margin:22px auto 8px;padding:12px 38px;text-align:center;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:15px;line-height:1.25;letter-spacing:.04em;text-transform:uppercase;color:#ffd83a;background:linear-gradient(#a3211a,#5e0f0b);clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%)}
.tm{text-align:center;color:#6b4e1f;font-size:12px;margin:0 0 12px}
h3{text-align:center;color:#4a1410;font-weight:700;letter-spacing:.08em;font-size:13px;margin:18px 0 4px}
.it{background:none;border:0;border-bottom:1px dotted rgba(192,144,44,.55);border-radius:0;box-shadow:none;margin:0;padding:11px 2px}
.it.open{background:rgba(255,255,255,.3);border-bottom-color:var(--gold);box-shadow:none}
.d{width:9px;height:9px;border:0;border-radius:0;background:currentColor}
.d::after{display:none}
.nm{flex:none;color:var(--ink);font-size:16px;font-weight:700}
.pr{flex:1;text-align:left;color:var(--ink);font-size:16px;font-weight:700}
.ds{color:var(--mut);padding-left:19px}
.spl{width:min(74vw,340px);mix-blend-mode:multiply;opacity:0;transform:scale(.88);animation:logoin 1.8s ease forwards}
@keyframes logoin{to{opacity:1;transform:none}}
.hl{width:min(60vw,230px);mix-blend-mode:multiply;display:block;margin:0 auto}
</style>
</head>

const m=document.getElementById('m'),nav=document.getElementById('nav');
M.forEach((c,k)=>{
 const s=document.createElement('section');s.id='c'+k;
 let h=`<h2></h2><div class="tm"></div>`;s.innerHTML=h;
 s.querySelector('h2').textContent=c.t;s.querySelector('.tm').textContent=c.tm;
 c.i.split('\n').forEach(l=>{
  if(l[0]==='#'){const e=document.createElement('h3');e.textContent=l.slice(1);s.append(e);return}
  const [n,p,t,d]=l.split('|');
  const it=document.createElement('div');it.className='it';
  it.innerHTML=`<div class="r"><span class="d ${t}"></span><span class="nm"></span><span class="pr"></span></div><div class="ds"></div>`;
  it.querySelector('.nm').textContent=n;it.querySelector('.pr').textContent='₹'+p;it.querySelector('.ds').textContent=d;
  it.onclick=()=>{const o=it.classList.contains('open');document.querySelectorAll('.it.open').forEach(x=>x.classList.remove('open'));if(!o)it.classList.add('open')};
  s.append(it)});
 m.append(s);
 const a=document.createElement('a');a.href='#c'+k;a.textContent=c.s;a.id='n'+k;nav.append(a);
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.05});
document.querySelectorAll('section').forEach(s=>io.observe(s));
const spy=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));const a=document.getElementById('n'+e.target.id.slice(1));a.classList.add('on');a.scrollIntoView({inline:'center',block:'nearest'})}}),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('section').forEach(s=>spy.observe(s));
const sp=document.getElementById('splash');
const hide=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),1100)};
setTimeout(hide,3200);sp.onclick=hide;
</script>
